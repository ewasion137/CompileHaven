name: Build Static TWM (musl)

on:
  push:
    paths:
      - '.github/workflows/build-twm.yml'
  workflow_dispatch:

jobs:
  build-twm:
    runs-on: ubuntu-latest
    container: alpine:latest

    steps:
      - name: Install build dependencies
        run: |
          apk update
          apk add --no-cache \
            build-base \
            bison \
            flex \
            pkgconf \
            autoconf \
            automake \
            libtool \
            util-macros \
            xz \
            curl \
            tar \
            linux-headers \
            xorgproto \
            libx11-dev \
            libx11-static \
            libxcb-static \
            libxext-dev \
            libice-dev \
            libsm-dev \
            libxt-dev \
            libxmu-dev \
            libxau-dev \
            libxdmcp-dev

      - name: Build missing static libraries
        run: |
          export CFLAGS="-O2 -fPIC -std=gnu11 -D_GNU_SOURCE -include stdint.h"

          # 1. Static libXt (1.3.1)
          curl -L -O https://www.x.org/releases/individual/lib/libXt-1.3.1.tar.xz
          tar -xf libXt-1.3.1.tar.xz && cd libXt-1.3.1
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc)
          cp src/.libs/libXt.a /usr/lib/
          cd ..

          # 2. Static libXmu
          curl -L -O https://www.x.org/releases/individual/lib/libXmu-1.2.1.tar.xz
          tar -xf libXmu-1.2.1.tar.xz && cd libXmu-1.2.1
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc)
          cp src/.libs/libXmu.a /usr/lib/
          cp src/.libs/libXmuu.a /usr/lib/
          cd ..

          # 3. Static libSM
          curl -L -O https://www.x.org/releases/individual/lib/libSM-1.2.4.tar.xz
          tar -xf libSM-1.2.4.tar.xz && cd libSM-1.2.4
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc)
          cp src/.libs/libSM.a /usr/lib/
          cd ..

          # 4. Static libICE
          curl -L -O https://www.x.org/releases/individual/lib/libICE-1.1.1.tar.xz
          tar -xf libICE-1.1.1.tar.xz && cd libICE-1.1.1
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc)
          cp src/.libs/libICE.a /usr/lib/
          cd ..

          # 5. Static libXext
          curl -L -O https://www.x.org/releases/individual/lib/libXext-1.3.6.tar.xz
          tar -xf libXext-1.3.6.tar.xz && cd libXext-1.3.6
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc)
          cp src/.libs/libXext.a /usr/lib/
          cd ..

      - name: Build Static TWM Binary
        run: |
          curl -L -O https://www.x.org/releases/individual/app/twm-1.0.12.tar.xz
          tar -xf twm-1.0.12.tar.xz
          cd twm-1.0.12

          export CC="gcc"
          export CFLAGS="-O2 -static -fno-pie -no-pie -std=gnu11 -D_GNU_SOURCE"
          export LDFLAGS="-static -no-pie"
          export PKG_CONFIG="pkg-config --static"
          export LIBS="-lxcb -lXau -lXdmcp"

          ./configure \
            --prefix=/usr \
            --enable-static \
            --disable-shared \
            LDFLAGS="-static -no-pie"

          make -j$(nproc) LDFLAGS="-static -no-pie"

          file src/twm
          strip src/twm

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp twm-1.0.12/src/twm output/twm.elf
          chmod +x output/twm.elf

      - name: Upload TWM Binary
        uses: actions/upload-artifact@v4
        with:
          name: twm-x86_64-static
          path: output/twm.elf
