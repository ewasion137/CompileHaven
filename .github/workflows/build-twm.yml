name: Build Static TWM (musl)

on:
  push:
    paths:
      - '.github/workflows/build-twm.yml'
  workflow_dispatch:

jobs:
  build-twm:
    runs-on: ubuntu-latest
    container: alpine:latest

    steps:
      - name: Install build dependencies
        run: |
          apk update
          apk add --no-cache \
            build-base \
            bison \
            flex \
            pkgconf \
            autoconf \
            automake \
            libtool \
            xz \
            curl \
            tar \
            libx11-dev \
            libx11-static \
            libxext-dev \
            libxext-static \
            libxmu-dev \
            libxmu-static \
            libxt-dev \
            libxt-static \
            libsm-dev \
            libsm-static \
            libice-dev \
            libice-static \
            libxau-dev \
            libxau-static \
            libxdmcp-dev \
            libxdmcp-static

      - name: Download TWM Source
        run: |
          curl -L -O https://www.x.org/releases/individual/app/twm-1.0.12.tar.xz
          tar -xf twm-1.0.12.tar.xz

      - name: Build Static TWM Binary
        run: |
          cd twm-1.0.12

          export CC="gcc"
          export CFLAGS="-O2 -static -fno-pie -no-pie"
          export LDFLAGS="-static -no-pie"
          export PKG_CONFIG="pkg-config --static"

          ./configure \
            --prefix=/usr \
            --enable-static \
            --disable-shared \
            LDFLAGS="-static -no-pie"

          make -j$(nproc) LDFLAGS="-all-static -static -no-pie"

          file src/twm
          strip src/twm

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp twm-1.0.12/src/twm output/twm.elf
          chmod +x output/twm.elf

      - name: Upload TWM Binary
        uses: actions/upload-artifact@v4
        with:
          name: twm-x86_64-static
          path: output/twm.elf
