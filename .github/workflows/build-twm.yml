name: Build Static TWM (musl)

on:
  push:
    paths:
      - '.github/workflows/build-twm.yml'
  workflow_dispatch:

jobs:
  build-twm:
    runs-on: ubuntu-latest
    container: alpine:latest

    steps:
      - name: Install build dependencies
        run: |
          apk update
          apk add --no-cache \
            build-base \
            bison \
            flex \
            pkgconf \
            autoconf \
            automake \
            libtool \
            util-macros \
            xz \
            curl \
            tar \
            git \
            linux-headers \
            xorgproto \
            libx11-dev \
            libx11-static \
            libxext-dev \
            libice-dev

      - name: Build Static X11 Dependencies
        run: |
          export PREFIX=/usr/local
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/lib64/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"
          export CFLAGS="-O2 -fPIC"

          # 1. libXau
          curl -L -O https://www.x.org/releases/individual/lib/libXau-1.0.11.tar.xz
          tar -xf libXau-1.0.11.tar.xz && cd libXau-1.0.11
          ./configure --prefix=${PREFIX} --libdir=${PREFIX}/lib --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 2. libXdmcp
          curl -L -O https://www.x.org/releases/individual/lib/libXdmcp-1.1.4.tar.xz
          tar -xf libXdmcp-1.1.4.tar.xz && cd libXdmcp-1.1.4
          ./configure --prefix=${PREFIX} --libdir=${PREFIX}/lib --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 3. libSM
          curl -L -O https://www.x.org/releases/individual/lib/libSM-1.2.4.tar.xz
          tar -xf libSM-1.2.4.tar.xz && cd libSM-1.2.4
          ./configure --prefix=${PREFIX} --libdir=${PREFIX}/lib --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 4. libXt
          curl -L -O https://www.x.org/releases/individual/lib/libXt-1.3.0.tar.xz
          tar -xf libXt-1.3.0.tar.xz && cd libXt-1.3.0
          ./configure --prefix=${PREFIX} --libdir=${PREFIX}/lib --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 5. libXmu
          curl -L -O https://www.x.org/releases/individual/lib/libXmu-1.2.1.tar.xz
          tar -xf libXmu-1.2.1.tar.xz && cd libXmu-1.2.1
          ./configure --prefix=${PREFIX} --libdir=${PREFIX}/lib --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

      - name: Build Static TWM Binary
        run: |
          curl -L -O https://www.x.org/releases/individual/app/twm-1.0.12.tar.xz
          tar -xf twm-1.0.12.tar.xz
          cd twm-1.0.12

          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:/usr/local/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"
          export CC="gcc"
          export CFLAGS="-O2 -static -fno-pie -no-pie -I/usr/local/include"
          export LDFLAGS="-static -no-pie -L/usr/local/lib"
          export PKG_CONFIG="pkg-config --static"

          ./configure \
            --prefix=/usr \
            --enable-static \
            --disable-shared \
            LDFLAGS="-static -no-pie -L/usr/local/lib"

          make -j$(nproc) LDFLAGS="-all-static -static -no-pie -L/usr/local/lib"

          file src/twm
          strip src/twm

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp twm-1.0.12/src/twm output/twm.elf
          chmod +x output/twm.elf

      - name: Upload TWM Binary
        uses: actions/upload-artifact@v4
        with:
          name: twm-x86_64-static
          path: output/twm.elf
