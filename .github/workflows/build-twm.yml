name: Build Static TWM (musl)

on:
  push:
    paths:
      - '.github/workflows/build-twm.yml'
  workflow_dispatch:

jobs:
  build-twm:
    runs-on: ubuntu-latest
    container: alpine:latest

    steps:
      - name: Install build dependencies
        run: |
          apk update
          apk add --no-cache \
            build-base \
            bison \
            flex \
            pkgconf \
            autoconf \
            automake \
            libtool \
            util-macros \
            xz \
            curl \
            tar \
            binutils \
            python3 \
            linux-headers \
            xorgproto \
            libx11-dev \
            libx11-static \
            libxcb-dev \
            libxcb-static \
            libxext-dev \
            libice-dev \
            libsm-dev \
            libxt-dev \
            libxmu-dev \
            libxau-dev \
            libxdmcp-dev

      - name: Build missing static libraries
        run: |
          export CFLAGS="-O2 -fPIC -std=gnu11 -D_GNU_SOURCE -include stdint.h"

          # 1. Static libXau
          curl -L -O https://www.x.org/releases/individual/lib/libXau-1.0.11.tar.xz
          tar -xf libXau-1.0.11.tar.xz && cd libXau-1.0.11
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 2. Static libXdmcp
          curl -L -O https://www.x.org/releases/individual/lib/libXdmcp-1.1.4.tar.xz
          tar -xf libXdmcp-1.1.4.tar.xz && cd libXdmcp-1.1.4
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 3. Static libXt (1.3.1)
          curl -L -O https://www.x.org/releases/individual/lib/libXt-1.3.1.tar.xz
          tar -xf libXt-1.3.1.tar.xz && cd libXt-1.3.1
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 4. Static libXmu
          curl -L -O https://www.x.org/releases/individual/lib/libXmu-1.2.1.tar.xz
          tar -xf libXmu-1.2.1.tar.xz && cd libXmu-1.2.1
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 5. Static libSM
          curl -L -O https://www.x.org/releases/individual/lib/libSM-1.2.4.tar.xz
          tar -xf libSM-1.2.4.tar.xz && cd libSM-1.2.4
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 6. Static libICE
          curl -L -O https://www.x.org/releases/individual/lib/libICE-1.1.1.tar.xz
          tar -xf libICE-1.1.1.tar.xz && cd libICE-1.1.1
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 7. Static libXext
          curl -L -O https://www.x.org/releases/individual/lib/libXext-1.3.6.tar.xz
          tar -xf libXext-1.3.6.tar.xz && cd libXext-1.3.6
          ./configure --prefix=/usr --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

      - name: Build Static TWM Binary
        run: |
          curl -L -O https://www.x.org/releases/individual/app/twm-1.0.12.tar.xz
          tar -xf twm-1.0.12.tar.xz
          cd twm-1.0.12

          ./configure --prefix=/usr CFLAGS="-O2 -std=gnu11 -D_GNU_SOURCE -fno-pie"

          # Компилируем объектные файлы (игнорируем ошибку финального линкера autotools, если он споткнется)
          make -j$(nproc) || true

          # Жесткая чистая статическая линковка напрямую
          gcc -static -no-pie src/*.o -o src/twm \
            -Wl,--start-group \
            /usr/lib/libXmu.a \
            /usr/lib/libXt.a \
            /usr/lib/libSM.a \
            /usr/lib/libICE.a \
            /usr/lib/libXext.a \
            /usr/lib/libX11.a \
            /usr/lib/libxcb.a \
            /usr/lib/libXau.a \
            /usr/lib/libXdmcp.a \
            -Wl,--end-group

          strip src/twm

      - name: Verify 100% Static ELF
        run: |
          echo "=== File Info ==="
          file twm-1.0.12/src/twm

          echo "=== Program Headers ==="
          readelf -l twm-1.0.12/src/twm

          # Падение если есть динамические секции
          if readelf -l twm-1.0.12/src/twm | grep -E 'INTERP|DYNAMIC'; then
            echo "ERROR: Binary is DYNAMIC!"
            exit 1
          fi

          echo "SUCCESS: 100% STATIC ELF VERIFIED."

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp twm-1.0.12/src/twm output/twm.elf
          chmod +x output/twm.elf

      - name: Upload TWM Binary
        uses: actions/upload-artifact@v4
        with:
          name: twm-x86_64-static
          path: output/twm.elf
